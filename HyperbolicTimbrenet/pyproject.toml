[project]
name = "hyperbolic-timbrenet"
version = "0.1.0"
description = "TimbreNet extended with hyperbolic layers for music generation"
requires-python = ">=3.9"
dependencies = [
    "matplotlib==3.6.0",
    "numpy==1.23.2",
    "scikit-learn==1.2.0",
    "scipy==1.10.0",
    "tensorflow==2.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "ty>=0.0.1a0",
    "bandit[toml]>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lib", "datasets"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.ty]
include = ["**/*.py"]
