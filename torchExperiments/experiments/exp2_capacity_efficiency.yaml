# =============================================================================
# EXPERIMENT 2: Capacity Efficiency — Hidden Size vs. Geometry
# =============================================================================
#
# HYPOTHESIS
# ----------
# H2 (Hyperbolic capacity efficiency): Hyperbolic space can represent
#   hierarchical structure with fewer parameters than Euclidean space because
#   hyperbolic geometry grows exponentially (volume ~ sinh(r)^{n-1}), matching
#   the exponential branching factor of trees.  Specifically, a hyperbolic
#   model at hidden_size=32 should match or outperform a Euclidean model at
#   hidden_size=128, demonstrating a ~4x compression ratio on hierarchical data
#   (Sala et al. 2018 "Representation Tradeoffs for Hyperbolic Embeddings").
#
# DESIGN RATIONALE
# ----------------
# - Sweep hidden_size across {16, 32, 64, 128} for both geometries.
# - Optimizer fixed to best-per-geometry: Radam for both (fair comparison;
#   Radam handles Euclidean parameters fine and is strictly better for
#   hyperbolic, so it is the conservative choice that does not artificially
#   penalize Euclidean).
# - Fixed moderate dataset (prefix 30, replace=0.1) — same as Exp 1 so
#   results are directly comparable.
# - 8 runs per config: slightly fewer than Exp 1 because the qualitative
#   trend (monotone improvement for Euclidean; plateau for hyperbolic) is
#   what we are measuring, not just a single comparison point.
# - hidden_size=16 is included to probe the low-capacity extreme where
#   Euclidean should fail first.
#
# EXPECTED OUTCOMES
# -----------------
# - Euclidean accuracy should increase monotonically with hidden_size.
# - Hyperbolic accuracy should plateau early (at hidden_size=32 or 64),
#   showing diminishing returns from additional capacity.
# - The crossover point (where Euclidean catches up) indicates the minimum
#   Euclidean capacity needed to match a compact hyperbolic representation.
#
# ANALYSIS NOTE
# -------------
# Plot mean test_acc ± 1 std-dev as a function of hidden_size for each
# geometry.  The key figure is a "capacity-accuracy" curve; the gap between
# the two curves at small hidden_size quantifies the hyperbolic efficiency
# advantage.
#
# COMPUTE ESTIMATE
# ----------------
# 2 models × 4 hidden_sizes × 8 runs = 64 runs
# =============================================================================

task: ganea
loss: cross
dataset: 30
replace: 0.1
epochs: 80
optimizer: Radam
runs: 8
wandb_project: hyperbolic-geometry-comparison

sweep:
  model: [euclidean, hyperbolic]
  hidden_size: [16, 32, 64, 128]
