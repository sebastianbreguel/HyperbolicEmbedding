# =============================================================================
# EXPERIMENT 5: Phylogenetic Regression — Real Tree-Structured Data
# =============================================================================
#
# HYPOTHESIS
# ----------
# H5a (Real-world hierarchy): On the Mircea phylogenetic task, hyperbolic
#   geometry achieves lower normalised L2 regression error than Euclidean
#   geometry because the ground-truth data is generated by an explicit binary
#   tree (A→B,C→D,E,F,G) with Hamming-distance mutation probabilities.
#   Hyperbolic space can represent the tree metric exactly in 2D
#   (Sarkar 2011 "Low Distortion Delaunay Embedding of Trees in Hyperbolic
#   Plane"), whereas Euclidean space requires O(n) dimensions for zero
#   distortion.
#
# H5b (Optimizer criticality on regression): On regression with MSE loss,
#   Riemannian Adam is especially important because gradients flow directly
#   through continuous outputs; incorrect Euclidean parameter updates
#   accumulate more obviously than in classification.
#
# DESIGN RATIONALE
# ----------------
# - Full 2×2 optimizer × geometry cross (primary comparison + optimizer test).
# - hidden_size swept {32, 64, 128}: tests whether hyperbolic capacity
#   efficiency holds on regression (same H2 logic as Exp 2, different task).
# - 10 runs for the primary 2×2 sub-experiment (geometry × optimizer at
#   default hidden_size=64), 8 runs for the hidden_size sweep.
# - epochs=120: regression tasks typically converge more slowly; the existing
#   mircea_single.yaml used 100, bumped slightly for reliability.
# - learning_rate=0.001: explicitly set to match codebase default and ensure
#   reproducibility regardless of config.py changes.
#
# EXPECTED OUTCOMES
# -----------------
# - Hyperbolic+Radam achieves the lowest normalised L2 error.
# - Euclidean+Radam and Euclidean+Adam are comparable (confirming H1c on
#   regression).
# - Hyperbolic+Adam has higher error than Hyperbolic+Radam (H1b on regression).
# - Capacity efficiency: Hyperbolic at hidden_size=32 should approach or
#   beat Euclidean at hidden_size=128.
#
# COMPUTE ESTIMATE
# ----------------
# Primary (geometry × optimizer): 2 × 2 × 10 = 40 runs
# Capacity sweep (geometry × hidden_size, Radam only): 2 × 3 × 8 = 48 runs
# Total: 88 runs  (run as two sequential YAML files)
# =============================================================================

task: mircea
loss: mse
epochs: 120
learning_rate: 0.001
runs: 10
wandb_project: hyperbolic-geometry-comparison

sweep:
  model: [euclidean, hyperbolic]
  optimizer: [Adam, Radam]
