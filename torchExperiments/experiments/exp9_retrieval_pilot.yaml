# =============================================================================
# EXPERIMENT 9: Hyperbolic Retrieval Pilot — Nearest-Neighbour in Curved Space
# =============================================================================
#
# HYPOTHESIS
# ----------
# H9a (Retrieval geometry advantage): When embeddings trained with hyperbolic
#   geometry are used for k-nearest-neighbour retrieval on hierarchical data,
#   they recover structurally related items (same subtree) at a higher rate
#   than Euclidean embeddings of the same dimensionality.  The intuition is
#   that hyperbolic distance places leaves of the same subtree closer together
#   than a Euclidean L2 metric on the same embedding vectors, so the top-k
#   retrieved set is enriched for true structural neighbours.
#
# H9b (Low-dimension advantage): The retrieval quality gap between hyperbolic
#   and Euclidean embeddings is largest at small embedding dimensions (hidden_
#   size 16-32), because hyperbolic space can represent exponentially more
#   nodes at radius r than a Euclidean ball, and this advantage is most salient
#   when the budget is tight (Sala et al. 2018, Theorem 1).
#
# H9c (Rank-based metric sensitivity): Hyperbolic embeddings improve mean
#   reciprocal rank (MRR) and recall@k more than NDCG, because the deepest
#   structural neighbours (most similar in tree distance) are pulled to within
#   the top-1 position — an effect visible in rank-based metrics but
#   partially masked in graded relevance metrics if "near" and "far" tree
#   neighbours have similar labels.
#
# WHAT THIS EXPERIMENT TESTS
# --------------------------
# This is a *pilot* experiment: the existing infrastructure (HNN) is designed
# for end-to-end classification/regression, not retrieval.  The pilot runs the
# model in its current form and extracts penultimate-layer embeddings (the
# output of HypLinear2 before the softmax/MLR) as a retrieval representation.
#
# NOTE: The current codebase does NOT expose intermediate embeddings.
# Before running this experiment you must add embedding extraction to
# training/trainer.py (see IMPLEMENTATION NOTE below).
#
# DESIGN RATIONALE
# ----------------
# - Task: ganea (synthetic tree structure — ground-truth hierarchy is known,
#   so we can measure true tree-structural neighbours precisely).
# - dataset=30: moderate prefix length gives non-trivial hierarchy depth.
# - replace=0.1: clean signal ensures the hierarchical structure is learnable
#   and retrievable.
# - hidden_size swept [16, 32, 64]: tests the dimension-advantage interaction
#   (H9b). 128 is excluded — retrieval pilots rarely need large capacity;
#   adding it would double compute with diminishing marginal value.
# - optimizer=Radam: already established as necessary for hyperbolic models.
# - runs=8: enough to compute stable mean MRR ± std.
# - epochs=80: matches Exp 1 (same task/data), ensuring embeddings are trained
#   to convergence.
#
# RETRIEVAL PROTOCOL (to be implemented in analysis scripts)
# ----------------------------------------------------------
# After training each model:
# 1. Extract the penultimate-layer embedding for all test-set examples.
# 2. For hyperbolic embeddings, compute pairwise distances using the Poincaré
#    metric:  d(u,v) = arcosh(1 + 2||u-v||^2 / ((1-||u||^2)(1-||v||^2)))
#    For Euclidean embeddings, use standard L2 distance.
# 3. For each query q in the test set, rank all gallery examples by distance.
# 4. Compute:
#      - Recall@k  (k=1,5,10): fraction of queries where at least 1 true
#        structural neighbour (same prefix class) is in the top-k.
#      - MRR: mean 1/rank of the first true neighbour.
#      - NDCG@10: discounted cumulative gain using tree-depth-based relevance.
# 5. Report mean ± std across runs.
#
# IMPLEMENTATION NOTE
# -------------------
# The HNN model must be modified to expose penultimate embeddings.
# Recommended change to models/hnn.py:
#
#   def encode(self, x: Tensor) -> Tensor:
#       """Return penultimate hyperbolic embedding (before classification head)."""
#       x = self.manifold.proj(self.manifold.expmap0(x))
#       x = self.hyp_act(self.linear1(x))
#       return self.linear2(x)   # shape [B, out_features] on the manifold
#
# For retrieval, use encode() not forward().  For hyperbolic models, the
# returned tensor lives on the Poincaré ball; for Euclidean, in R^d.
#
# EXPECTED OUTCOMES
# -----------------
# - Recall@1 (hyperbolic) > Recall@1 (Euclidean) by at least 5 pp for
#   hidden_size in {16, 32}.
# - The gap narrows to <2 pp at hidden_size=64 (H9b: advantage fades with
#   more capacity).
# - MRR shows a larger absolute gap than NDCG@10 (H9c).
# - This pilot either (a) validates the hypothesis and motivates a full
#   retrieval experiment, or (b) reveals that the HNN classifier is not
#   an effective retrieval encoder, motivating metric-learning training.
#
# FUTURE DIRECTIONS (if pilot confirms H9a)
# ------------------------------------------
# 1. Train with a contrastive / triplet loss specifically for retrieval.
# 2. Evaluate on the Mircea phylogenetic task (known tree distances → exact
#    ground truth for ranking).
# 3. Compare against Poincaré embeddings (Nickel & Kiela 2017) as a dedicated
#    retrieval baseline trained with reconstruction loss on tree edges.
# 4. Scale to larger trees with configurable branching factor to map out
#    when the hyperbolic advantage saturates.
#
# COMPUTE ESTIMATE
# ----------------
# 2 models × 3 hidden_sizes × 8 runs = 48 runs
# (Does not run until embedding extraction is implemented — mark as BLOCKED
#  until models/hnn.py is updated with encode() method.)
# =============================================================================

task: ganea
loss: cross
dataset: 30
replace: 0.1
optimizer: Radam
epochs: 80
runs: 8
wandb_project: hyperbolic-retrieval-pilot

sweep:
  model: [euclidean, hyperbolic]
  hidden_size: [16, 32, 64]
