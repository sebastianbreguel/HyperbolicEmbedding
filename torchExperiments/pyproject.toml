[project]
name = "torch-experiments"
version = "0.1.0"
description = "Hyperbolic neural network experiments with PyTorch"
requires-python = ">=3.9"
dependencies = [
    "geoopt==0.5.0",
    "numpy==1.23.2",
    "pandas==1.4.4",
    "pyyaml>=6.0",
    "scikit-learn==1.1.2",
    "scipy==1.10.0",
    "torch<=1.13.0",
    "torchvision==0.13.1",
    "umap-learn==0.5.3",
    "wandb>=0.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "ty>=0.0.1a0",
    "bandit[toml]>=1.7.0",
    "pytest>=7.0.0",
    "setuptools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "layers", "manifolds", "models", "optimizer", "training"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert statements are fine in non-test code here

[tool.ty]
# Entrypoint for type checking
include = ["**/*.py"]
